schema_version: 1

context:
  version: "0.5.0"
  python_min: "3.11"

package:
  name: benched
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/benched/benched-${{ version }}.tar.gz
  sha256: 9418ad69c8a46a775d21b863dd2b74adaf3f47104ef318d2ed2fefd648f0c53b

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - benched = benched.cli:main
  script:
    env:
      SKIP_HATCH_JS: "1"
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - hatch-js
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - fsspec >=2024.6
    - pluggy >=1.5,<2
    - psutil >=5.9
    - pytest >=8.1
    - pytest-benchmark >=5.2,<6
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - benched
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - benched --help

about:
  homepage: https://github.com/1kbgz/benched
  repository: https://github.com/1kbgz/benched
  summary: Easy benchmarking
  description: |
    Benched is a current-environment benchmark runner with durable,
    commit-aware history and embeddable reports.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timkpaine
